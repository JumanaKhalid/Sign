<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاً لنساعد | Together We Help</title>
    
    <!-- استدعاء مكتبة التصميم Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- إعدادات الخط العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; }
        
        @keyframes float {
          0%, 100% { transform: translateY(0) rotate(0); }
          50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes modalIn {
          from { opacity: 0; transform: scale(0.9) translateY(40px); }
          to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-spin-slow { animation: spin 8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- استدعاء React و ReactDOM والمكتبات عبر CDN -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.284.0"
            }
        }
    </script>

    <script type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import ReactDOM from 'react-dom/client';
        import { 
            Camera, Mic, Image as ImageIcon, Bell, LogOut, ArrowRight, 
            Activity, HandMetal, Heart, Eye, Zap, ShieldCheck, 
            Smartphone, Volume2, AlertTriangle, Brain, Settings 
        } from 'lucide-react';

        const App = () => {
            // --- إدارة الحالة (State Management) ---
            const [step, setStep] = useState('welcome');
            const [ageGroup, setAgeGroup] = useState(null);
            const [email, setEmail] = useState('');
            const [activeFeature, setActiveFeature] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [prediction, setPrediction] = useState("");
            const [inputText, setInputText] = useState("");
            const [emergencyAlert, setEmergencyAlert] = useState(false);
            const [cameraStream, setCameraStream] = useState(false);
            const videoRef = useRef(null);

            const isYoung = ageGroup === 'young';

            // --- إعدادات التصميم (Theme) ---
            const theme = {
                mainBg: isYoung ? 'bg-gradient-to-br from-blue-50 via-white to-blue-100' : 'bg-slate-950',
                card: isYoung ? 'bg-white/90 backdrop-blur-md' : 'bg-slate-900/90 border border-slate-800',
                text: isYoung ? 'text-blue-900' : 'text-slate-100',
                accent: 'bg-blue-600',
                border: isYoung ? 'border-blue-100' : 'border-slate-800'
            };

            // --- دوال المحاكاة والذكاء الاصطناعي ---
            
            // 1. تشغيل الكاميرا الحقيقية
            const toggleCamera = async () => {
                if (cameraStream) {
                    const tracks = videoRef.current.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                    setCameraStream(false);
                } else {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        if (videoRef.current) {
                            videoRef.current.srcObject = stream;
                            setCameraStream(true);
                        }
                    } catch (err) {
                        console.error("Camera access denied", err);
                        alert("يرجى السماح بالوصول للكاميرا لتجربة هذه الميزة");
                    }
                }
            };

            // 2. محاكاة ترجمة الإشارة
            const processSignLanguage = () => {
                setIsProcessing(true);
                setPrediction("");
                setTimeout(() => {
                    const phrases = ["أنا أحتاج للماء", "كيف حالك؟", "شكراً لمساعدتكم", "أريد الذهاب للمستشفى"];
                    const res = phrases[Math.floor(Math.random() * phrases.length)];
                    setPrediction(res);
                    setIsProcessing(false);
                    // نطق الجملة
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(res);
                        utterance.lang = 'ar-SA';
                        window.speechSynthesis.speak(utterance);
                    }
                }, 2000);
            };

            // 3. محاكاة رادار الطوارئ
            const triggerEmergency = () => {
                setEmergencyAlert(true);
                if (navigator.vibrate) navigator.vibrate([100, 30, 100, 30, 500]);
                setTimeout(() => setEmergencyAlert(false), 5000);
            };

            // --- شاشات التطبيق ---

            // شاشة الترحيب
            if (step === 'welcome') {
                return (
                    <div className="min-h-screen bg-blue-600 flex flex-col items-center justify-center p-6 text-white text-center overflow-hidden relative">
                        <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                        <div className="relative z-10 animate-[float_4s_easeInOut_infinite]">
                            <div className="text-9xl mb-8 filter drop-shadow-2xl">🫱🏽‍🫲🏻</div>
                        </div>
                        <h1 className="text-7xl font-black mb-2 tracking-tighter drop-shadow-lg">معاً</h1>
                        <h2 className="text-4xl font-light mb-12 tracking-widest opacity-90">لنساعد</h2>
                        <button 
                            onClick={() => setStep('login')}
                            className="bg-white text-blue-600 px-16 py-6 rounded-full font-black text-2xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] hover:scale-105 hover:bg-blue-50 transition-all duration-300 flex items-center gap-3"
                        >
                            ابدأ الرحلة <ArrowRight className="w-8 h-8" />
                        </button>
                    </div>
                );
            }

            // شاشة تسجيل الدخول
            if (step === 'login') {
                return (
                    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 relative overflow-hidden" dir="rtl">
                        <div className="absolute -top-20 -right-20 w-96 h-96 bg-blue-500 rounded-full opacity-10 blur-3xl"></div>
                        <div className="bg-white/80 backdrop-blur-xl rounded-[40px] p-10 w-full max-w-xl shadow-2xl border border-white/50 relative z-10">
                            <div className="text-center mb-10">
                                <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto mb-4 flex items-center justify-center text-white shadow-lg rotate-3">
                                    <ShieldCheck size={32}/>
                                </div>
                                <h2 className="text-3xl font-black text-slate-800">بوابة الدخول</h2>
                                <p className="text-slate-400 mt-2">اختر الفئة المناسبة لنخصص التجربة لك</p>
                            </div>
                            
                            <div className="space-y-6">
                                <div className="relative">
                                    <input 
                                        type="email" 
                                        placeholder="البريد الإلكتروني" 
                                        className="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white transition-all text-lg"
                                        onChange={(e) => setEmail(e.target.value)}
                                    />
                                    <span className="absolute left-5 top-1/2 -translate-y-1/2 text-slate-400">@</span>
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <button 
                                        onClick={() => setAgeGroup('young')}
                                        className={`p-6 rounded-[30px] border-4 transition-all flex flex-col items-center gap-2 ${ageGroup === 'young' ? 'border-blue-500 bg-blue-50 scale-105 shadow-lg' : 'border-slate-100 hover:bg-slate-50 opacity-60'}`}
                                    >
                                        <div className="text-5xl mb-2">🧒🏻</div>
                                        <span className="font-bold text-blue-700">جيل الأمل</span>
                                        <span className="text-xs text-blue-400 font-bold">4 - 16 سنة</span>
                                    </button>
                                    <button 
                                        onClick={() => setAgeGroup('senior')}
                                        className={`p-6 rounded-[30px] border-4 transition-all flex flex-col items-center gap-2 ${ageGroup === 'senior' ? 'border-slate-800 bg-slate-900 text-white scale-105 shadow-lg' : 'border-slate-100 hover:bg-slate-50 opacity-60'}`}
                                    >
                                        <div className="text-5xl mb-2">🧓🏻</div>
                                        <span className="font-bold text-slate-700 group-hover:text-slate-900">جيل الحكمة</span>
                                        <span className="text-xs text-slate-400 font-bold">55+ سنة</span>
                                    </button>
                                </div>

                                <button 
                                    disabled={!ageGroup || !email}
                                    onClick={() => setStep('home')}
                                    className="w-full bg-blue-600 text-white py-6 rounded-[25px] font-black text-xl shadow-xl hover:bg-blue-700 disabled:bg-slate-200 disabled:cursor-not-allowed transition-all active:scale-95"
                                >
                                    تسجيل الدخول
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            // الشاشة الرئيسية (Dashboard)
            return (
                <div className={`min-h-screen ${theme.mainBg} ${theme.text} transition-colors duration-700 font-sans`} dir="rtl">
                    
                    {/* تنبيه الطوارئ */}
                    {emergencyAlert && (
                        <div className="fixed inset-0 z-[9999] bg-red-600 animate-pulse opacity-50 pointer-events-none flex items-center justify-center">
                            <div className="bg-white p-10 rounded-full animate-bounce">
                                <AlertTriangle size={64} className="text-red-600" />
                            </div>
                        </div>
                    )}

                    {/* الشريط العلوي */}
                    <header className={`p-6 sticky top-0 z-50 border-b ${theme.border} ${theme.card} flex justify-between items-center shadow-sm`}>
                        <div className="flex items-center gap-4">
                            <div className="relative group cursor-pointer">
                                <div className="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30 group-hover:rotate-12 transition-transform">
                                    <Activity size={24}/>
                                </div>
                                <div className="absolute -top-1 -right-1 w-3 h-3 bg-green-500 border-2 border-white rounded-full animate-ping"></div>
                            </div>
                            <div>
                                <h2 className="text-xl font-black tracking-tight">معاً لنساعد</h2>
                                <p className="text-[10px] font-bold text-blue-500 flex items-center gap-1 opacity-80">
                                    <Smartphone size={10}/> متصل بالنظام الذكي
                                </p>
                            </div>
                        </div>
                        <div className="flex gap-2">
                             <button className="p-3 rounded-xl bg-gray-100 hover:bg-gray-200 transition-colors text-gray-600"><Settings size={20}/></button>
                             <button onClick={() => setStep('login')} className="p-3 bg-red-50 text-red-500 rounded-xl hover:bg-red-100 transition-colors"><LogOut size={20}/></button>
                        </div>
                    </header>

                    <main className="p-6 md:p-10 max-w-7xl mx-auto pb-32">
                        <div className="flex flex-col md:flex-row justify-between items-end mb-10 gap-4">
                            <div>
                                <h1 className="text-4xl md:text-5xl font-black mb-2 leading-tight">
                                    {isYoung ? 'أهلاً بك يا بطل! 🚀' : 'مرحباً بك، يومك سعيد 🌷'}
                                </h1>
                                <p className="text-lg opacity-60">نحن هنا لنجعل تواصلك أسهل وأسرع.</p>
                            </div>
                            <div className={`${theme.card} px-6 py-3 rounded-full border border-blue-500/20 flex items-center gap-3 shadow-sm`}>
                                <Brain className="text-blue-500 animate-pulse" size={20} />
                                <span className="font-bold text-sm">محرك الذكاء الاصطناعي: نشط</span>
                            </div>
                        </div>

                        {/* شبكة الخدمات */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            {/* ميزة 1 */}
                            <div onClick={() => setActiveFeature(1)} className={`${theme.card} p-8 rounded-[40px] shadow-xl cursor-pointer hover:-translate-y-2 hover:shadow-2xl transition-all border-b-[8px] border-blue-500 group relative overflow-hidden`}>
                                <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/5 rounded-bl-[100px] -mr-4 -mt-4 transition-all group-hover:bg-blue-500/10"></div>
                                <div className="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                    <Camera size={32}/>
                                </div>
                                <h3 className="text-2xl font-black mb-2">مترجم الإشارة</h3>
                                <p className="text-sm opacity-60 font-medium">ترجمة فورية من الكاميرا إلى صوت</p>
                            </div>

                            {/* ميزة 2 */}
                            <div onClick={() => setActiveFeature(2)} className={`${theme.card} p-8 rounded-[40px] shadow-xl cursor-pointer hover:-translate-y-2 hover:shadow-2xl transition-all border-b-[8px] border-purple-500 group relative overflow-hidden`}>
                                <div className="absolute top-0 right-0 w-32 h-32 bg-purple-500/5 rounded-bl-[100px] -mr-4 -mt-4 transition-all group-hover:bg-purple-500/10"></div>
                                <div className="w-16 h-16 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-purple-600 group-hover:text-white transition-colors">
                                    <HandMetal size={32}/>
                                </div>
                                <h3 className="text-2xl font-black mb-2">الأفاتار المساعد</h3>
                                <p className="text-sm opacity-60 font-medium">تحويل كتابتك إلى لغة إشارة</p>
                            </div>

                            {/* ميزة 3 */}
                            <div onClick={() => setActiveFeature(3)} className={`${theme.card} p-8 rounded-[40px] shadow-xl cursor-pointer hover:-translate-y-2 hover:shadow-2xl transition-all border-b-[8px] border-red-500 group relative overflow-hidden`}>
                                <div className="absolute top-0 right-0 w-32 h-32 bg-red-500/5 rounded-bl-[100px] -mr-4 -mt-4 transition-all group-hover:bg-red-500/10"></div>
                                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-red-600 group-hover:text-white transition-colors animate-pulse">
                                    <Bell size={32}/>
                                </div>
                                <h3 className="text-2xl font-black mb-2">رادار الأصوات</h3>
                                <p className="text-sm opacity-60 font-medium">تنبيهات للأصوات الخطرة (ساعة)</p>
                            </div>

                            {/* ميزة 4 */}
                            <div onClick={() => setActiveFeature(4)} className={`${theme.card} p-8 rounded-[40px] shadow-xl cursor-pointer hover:-translate-y-2 hover:shadow-2xl transition-all border-b-[8px] border-emerald-500 group relative overflow-hidden`}>
                                <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-500/5 rounded-bl-[100px] -mr-4 -mt-4 transition-all group-hover:bg-emerald-500/10"></div>
                                <div className="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                                    <ImageIcon size={32}/>
                                </div>
                                <h3 className="text-2xl font-black mb-2">تحليل اللوحات</h3>
                                <p className="text-sm opacity-60 font-medium">قراءة النصوص من الصور وترجمتها</p>
                            </div>
                        </div>

                        {/* قسم الفريق */}
                        <footer className="mt-20 relative">
                           <div className="absolute inset-0 bg-gradient-to-r from-blue-600 via-purple-600 to-emerald-600 rounded-[50px] blur-xl opacity-20"></div>
                           <div className="relative bg-slate-900 rounded-[50px] p-10 md:p-14 text-center text-white overflow-hidden shadow-2xl">
                               <div className="flex justify-center mb-6">
                                   <div className="p-4 bg-white/10 rounded-full border border-white/10">
                                       <Heart className="text-red-500 fill-red-500 w-8 h-8 animate-bounce" />
                                   </div>
                               </div>
                               <h2 className="text-3xl font-black mb-2">فريق العمل المبدع</h2>
                               <p className="text-slate-400 mb-10">صُنع هذا المشروع بكل حب بواسطة</p>
                               <div className="flex flex-wrap justify-center gap-4">
                                  {["فوزيه السيد", "خوله الغامدي", "مريان رصرص", "سميه فخرو", "فرح نور الدين"].map((n, i) => (
                                      <div key={i} className="bg-white/5 backdrop-blur-sm border border-white/10 px-6 py-3 rounded-2xl hover:bg-white/20 transition-all cursor-default">
                                          <span className="font-bold">{n}</span>
                                      </div>
                                  ))}
                               </div>
                           </div>
                        </footer>
                    </main>

                    {/* نوافذ الخدمات (Modals) */}
                    {activeFeature && (
                        <div className="fixed inset-0 z-[500] bg-black/80 backdrop-blur-xl flex items-center justify-center p-4 overflow-y-auto">
                            <div className={`${theme.card} w-full max-w-3xl rounded-[50px] overflow-hidden relative shadow-2xl animate-[modalIn_0.4s_ease-out]`}>
                                
                                <button 
                                    onClick={() => {setActiveFeature(null); setPrediction(""); setIsProcessing(false);}} 
                                    className="absolute top-6 left-6 w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center hover:bg-red-500 hover:text-white transition-all z-50"
                                >
                                    <span className="text-2xl font-bold">×</span>
                                </button>

                                <div className="p-8 md:p-12">
                                    {/* محتوى الميزة 1 */}
                                    {activeFeature === 1 && (
                                        <div className="space-y-8 text-center">
                                            <div>
                                                <h2 className="text-3xl font-black mb-2">كاميرا الترجمة الذكية</h2>
                                                <p className="opacity-60">وجه الكاميرا نحو الشخص ليتم ترجمة حركاته</p>
                                            </div>
                                            <div className="relative aspect-video bg-black rounded-[30px] overflow-hidden border-4 border-slate-100 shadow-inner">
                                                <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover scale-x-[-1]"></video>
                                                {!cameraStream && (
                                                    <div className="absolute inset-0 flex items-center justify-center bg-slate-900">
                                                        <Camera size={64} className="text-slate-700"/>
                                                    </div>
                                                )}
                                                {isProcessing && (
                                                    <div className="absolute inset-0 bg-blue-600/30 flex flex-col items-center justify-center backdrop-blur-sm">
                                                        <div className="w-16 h-16 border-4 border-white border-t-transparent rounded-full animate-spin mb-4"></div>
                                                        <span className="text-white font-bold animate-pulse">جاري التحليل...</span>
                                                    </div>
                                                )}
                                                {prediction && (
                                                    <div className="absolute bottom-6 left-6 right-6 bg-white p-4 rounded-2xl shadow-xl animate-[modalIn_0.3s_ease-out]">
                                                        <p className="text-2xl font-black text-blue-600 flex items-center justify-center gap-2">
                                                            <Volume2 size={24}/> {prediction}
                                                        </p>
                                                    </div>
                                                )}
                                            </div>
                                            <div className="flex gap-4">
                                                <button onClick={toggleCamera} className={`flex-1 py-4 rounded-2xl font-bold text-lg transition-all ${cameraStream ? 'bg-red-100 text-red-600 hover:bg-red-200' : 'bg-slate-800 text-white hover:bg-slate-900'}`}>
                                                    {cameraStream ? 'إيقاف الكاميرا' : 'تشغيل الكاميرا'}
                                                </button>
                                                <button onClick={processSignLanguage} disabled={!cameraStream} className="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-bold text-lg shadow-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
                                                    ترجمة فورية
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* محتوى الميزة 2 */}
                                    {activeFeature === 2 && (
                                        <div className="space-y-8 text-center">
                                            <div>
                                                <h2 className="text-3xl font-black mb-2 text-purple-600">الأفاتار المساعد</h2>
                                                <p className="opacity-60">اكتب ما تريد قوله وسنقوم بتمثيله بلغة الإشارة</p>
                                            </div>
                                            <div className="h-64 bg-purple-50 rounded-[30px] flex items-center justify-center border-2 border-dashed border-purple-200 relative overflow-hidden">
                                                <div className="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-purple-500 to-transparent"></div>
                                                <div className="relative text-center">
                                                    <div className="text-8xl mb-4 animate-[float_3s_easeInOut_infinite]">👩🏻‍💻</div>
                                                    <p className="font-bold text-purple-400">منطقة ظهور الأفاتار 3D</p>
                                                </div>
                                            </div>
                                            <div className="flex gap-2 bg-slate-50 p-2 rounded-[20px] border border-slate-200">
                                                <input 
                                                    className="flex-1 bg-transparent p-4 outline-none font-bold text-lg"
                                                    placeholder="اكتب جملة هنا..."
                                                    value={inputText}
                                                    onChange={(e) => setInputText(e.target.value)}
                                                />
                                                <button className="bg-purple-600 text-white p-4 rounded-2xl hover:bg-purple-700 transition-all">
                                                    <Zap size={24}/>
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {/* محتوى الميزة 3 */}
                                    {activeFeature === 3 && (
                                        <div className="space-y-10 text-center py-4">
                                            <div>
                                                <h2 className="text-3xl font-black mb-2 text-red-600">رادار الأصوات 360°</h2>
                                                <p className="opacity-60">يعمل في الخلفية للتعرف على أصوات الخطر</p>
                                            </div>
                                            <div className="relative w-64 h-64 mx-auto">
                                                <div className={`absolute inset-0 rounded-full border-[20px] transition-colors duration-300 ${emergencyAlert ? 'border-red-500' : 'border-slate-100'}`}></div>
                                                <div className={`absolute inset-0 flex items-center justify-center rounded-full transition-all duration-300 ${emergencyAlert ? 'bg-red-50 scale-90' : 'bg-white scale-100'}`}>
                                                    <Bell size={80} className={`${emergencyAlert ? 'text-red-600 animate-bounce' : 'text-slate-300'}`} />
                                                </div>
                                                {/* حلقات الرادار */}
                                                {!emergencyAlert && (
                                                    <>
                                                        <div className="absolute inset-0 border-2 border-blue-500/30 rounded-full animate-ping" style={{animationDuration: '2s'}}></div>
                                                        <div className="absolute inset-0 border-2 border-blue-500/20 rounded-full animate-ping" style={{animationDuration: '3s'}}></div>
                                                    </>
                                                )}
                                            </div>
                                            <button 
                                                onClick={triggerEmergency}
                                                className="w-full py-5 bg-red-600 text-white rounded-[25px] font-black text-xl shadow-xl shadow-red-500/30 hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-3"
                                            >
                                                <AlertTriangle /> تجربة تنبيه الخطر
                                            </button>
                                            <p className="text-xs opacity-50">عند الضغط، سيقوم الهاتف بالاهتزاز وستومض الشاشة لمحاكاة تنبيه الساعة الذكية</p>
                                        </div>
                                    )}

                                    {/* محتوى الميزة 4 */}
                                    {activeFeature === 4 && (
                                        <div className="space-y-8 text-center">
                                            <div>
                                                <h2 className="text-3xl font-black mb-2 text-emerald-600">قارئ اللوحات الذكي</h2>
                                                <p className="opacity-60">حول أي نص مرئي إلى لغة إشارة</p>
                                            </div>
                                            <div className="h-64 border-4 border-dashed border-emerald-200 rounded-[30px] bg-emerald-50/50 flex flex-col items-center justify-center cursor-pointer hover:bg-emerald-100/50 transition-colors group">
                                                <div className="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg mb-4 group-hover:scale-110 transition-transform">
                                                    <ImageIcon size={32} className="text-emerald-500"/>
                                                </div>
                                                <p className="font-bold text-emerald-700">اضغط لرفع صورة أو التقاطها</p>
                                                <p className="text-xs text-emerald-500 mt-1">يدعم JPG, PNG</p>
                                            </div>
                                            <button className="w-full py-5 bg-emerald-600 text-white rounded-[25px] font-black text-xl shadow-xl shadow-emerald-500/30 hover:bg-emerald-700 transition-all">
                                                بدء المسح الضوئي
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
